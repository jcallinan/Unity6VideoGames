name: Build and deploy WebGL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE" || { echo "::error::Set the UNITY_LICENSE repository secret."; exit 1; }
          test -n "$UNITY_EMAIL" || { echo "::error::Set the UNITY_EMAIL repository secret."; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "::error::Set the UNITY_PASSWORD repository secret."; exit 1; }

      - name: Build WebGL player
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: auto
          buildName: RiftRunner
          buildsPath: build

      - name: Verify WebGL build
        run: |
          test -s build/WebGL/RiftRunner/index.html
          touch build/WebGL/RiftRunner/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/WebGL/RiftRunner
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
